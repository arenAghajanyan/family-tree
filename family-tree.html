<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family Tree</title>
<style>
:root{--bg:#f6f2ea;--panel:#fffdf8;--ink:#2b2622;--muted:#7a6f64;--line:#cfc3b2;--accent:#8a5a2b;--accent-ink:#fff;--m:#dfe9f3;--f:#f6e1e6;--u:#ece8e1;--danger:#b3261e;--mS:#7fa6cc;--fS:#d08aa0}
@media (prefers-color-scheme:dark){:root{--bg:#1d1a17;--panel:#262220;--ink:#eee6dc;--muted:#a89c8f;--line:#574d43;--accent:#d49a5c;--accent-ink:#1d1a17;--m:#2a3540;--f:#3f2c32;--u:#34302b;--danger:#f2b8b5;--mS:#6f93b8;--fS:#bd7f93}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:grid;grid-template-columns:260px 1fr 330px;overflow:hidden}
h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:600}
button{font:inherit;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:inherit;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:inherit;width:100%}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}

#side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
#side header{padding:16px 16px 10px}
#side h1{font-size:21px;margin:0}
#side .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
#side .hd .x{font-size:18px;line-height:1;padding:4px 8px}
body.side-closed{grid-template-columns:1fr 330px}
body.side-closed #side{display:none}
#sideOpen{display:none}
body.side-closed #sideOpen{display:inline-block}
#search{margin:0 12px 8px;width:auto}
#list{list-style:none;margin:0;padding:0 6px;overflow:auto;flex:1}
#list li{padding:6px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
#list li:hover{background:var(--u)}
#list li.on{background:var(--accent);color:var(--accent-ink)}
.yr{color:var(--muted);font-size:12px;white-space:nowrap}
#list li.on .yr{color:inherit;opacity:.85}
.side-actions{padding:12px;border-top:1px solid var(--line);display:grid;gap:6px}
.side-actions .two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#status{padding:0 12px 12px;color:var(--muted);font-size:12px}
#status.warn{color:var(--danger)}

#side .rootpick{margin:12px 0 0}
#tree{overflow:auto;position:relative;min-height:0}
#treebar{position:sticky;top:0;left:0;width:max-content;z-index:3;display:flex;gap:6px;padding:12px 12px 0}
#treebar[hidden]{display:none}
#treebar .zb{min-width:36px;padding:7px 10px}
#treebar button{white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.15)}
#canvas{position:relative}
#canvas.blank{display:flex;justify-content:center;padding:40px 16px}
#canvas:not(.blank) #rows{position:absolute;inset:0}
#lines{position:absolute;left:0;top:0;pointer-events:none}
#lines path{fill:none;stroke:var(--line);stroke-width:2}
#lines path.g{stroke-dasharray:4 4}
.card{position:absolute;width:160px;height:64px;padding:6px 10px;border-radius:10px;background:var(--u);border:1px solid var(--line);cursor:pointer;text-align:center;display:flex;flex-direction:column;justify-content:center;color:inherit;font:inherit;overflow:hidden}
.card.s-M{background:var(--m)}
.card.s-F{background:var(--f)}
.card .nm{font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .yr{white-space:normal}
.card.sib{opacity:.8}
/* Partners who married in (not blood relatives of the main person) */
.card.inlaw{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--line);padding-left:8px}
.card.inlaw.s-M{border-left-color:var(--mS)}
.card.inlaw.s-F{border-left-color:var(--fS)}
.card.inlaw .nm{font-style:italic;font-weight:500}
.card.sib .nm{font-weight:500}
.card.root{border:2px solid var(--accent)}
.card.focus{outline:3px solid var(--accent);outline-offset:2px}
.rootnote{color:var(--accent);font-size:13px;font-weight:600;margin:-6px 0 12px}
.mk{margin:-6px 0 12px}
.addons{position:absolute;transform:translateX(-50%);display:flex;gap:4px;z-index:2;white-space:nowrap}
.addons button{font-size:12px;padding:3px 9px;border-radius:999px;border:1.5px dashed var(--accent);background:var(--panel);color:var(--accent)}
.addons button:hover{background:var(--accent);color:var(--accent-ink);border-style:solid}
@keyframes locate{0%,100%{box-shadow:0 0 0 0 transparent}35%{box-shadow:0 0 0 12px color-mix(in srgb,var(--accent) 45%,transparent)}}
.card.located{animation:locate 1s ease-out 2}
.hint{background:var(--u);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--muted);margin:0 0 12px}
.card.ghost{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.card:hover{border-color:var(--accent)}
.empty{max-width:420px;text-align:center;margin-top:10vh}
.empty h2{font-size:26px;margin:0 0 8px}
.empty p{color:var(--muted)}
.empty .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}

#panel{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px;min-height:0}
#panel h2{font-size:21px;margin:0 0 14px}
.fld{display:grid;gap:3px;margin-bottom:10px}
.fld span{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 4px}
.rel{display:flex;align-items:center;gap:8px;padding:3px 0}
.rel a{color:var(--accent);cursor:pointer;flex:1}
.rel a:hover{text-decoration:underline}
.none{color:var(--muted);font-size:13px}
.x{border:none;background:none;color:var(--muted);padding:2px 6px}
.x:hover{color:var(--danger)}
.adds{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px}
.danger{color:var(--danger);border-color:transparent;background:none;margin-top:22px;padding-left:0}
.muted{color:var(--muted)}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:20px;width:min(440px,92vw)}
#full{width:96vw;max-width:96vw;height:92vh;max-height:92vh;padding:0;overflow:hidden}
#full[open]{display:flex;flex-direction:column}
.fullbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.fullbar h3{margin:0 auto 0 0}
#fullView{flex:1;overflow:auto;background:#fffdf8}
#fullView svg{display:block;width:100%;height:auto}
#fullView.actual svg{width:auto;max-width:none}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{margin:0 0 14px;font-family:Georgia,serif;font-size:19px}
dialog .or{text-align:center;color:var(--muted);font-size:12px;margin:4px 0 10px}
dialog menu{display:flex;justify-content:flex-end;gap:8px;padding:0;margin:16px 0 0}

/* Photos */
.card .tx{min-width:0;width:100%}
.card.hasph{flex-direction:row;align-items:center;gap:8px;text-align:left;padding:6px 8px}
.card .ph{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;background:var(--panel);border:1px solid var(--line)}
.photo{display:flex;align-items:center;gap:14px;margin:0 0 14px}
.photo img,.photo .ph0{width:84px;height:84px;border-radius:50%;object-fit:cover;border:1px solid var(--line);flex:none}
.photo .ph0{display:flex;align-items:center;justify-content:center;background:var(--u);color:var(--muted);font:600 30px Georgia,serif}
.photo .btns{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
/* Partnerships */
#lines path.e{stroke-dasharray:7 5}
.cpl{position:absolute;transform:translate(-50%,-50%);z-index:2;min-width:20px;height:20px;padding:0 3px;display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:999px;cursor:default}
.cpl.ended{color:var(--danger);font-weight:700}
.pship{border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:6px 0}
.pship .rel{padding:0}
.three{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:6px;margin-top:6px}
.three select,.three input{padding:5px 6px;font-size:13px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin:-2px 0 10px;cursor:pointer}
.chk input{width:auto;margin:0}
.relto{color:var(--muted);font-size:13px;margin:-8px 0 12px}
.relto a{color:var(--accent);cursor:pointer}
/* Tools: relationship finder, dates, charts */
.big{font-size:16px;line-height:1.5;margin:4px 0 8px}
.out{min-height:60px}
.dl{list-style:none;margin:0;padding:0;max-height:60vh;overflow:auto}
.dl li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.dl li:last-child{border-bottom:none}
.dl .when{color:var(--muted);font-size:12px;padding-top:2px}
.dl .when b{color:var(--accent)}
.dl a{color:var(--accent);cursor:pointer;font-weight:600}
.dl .past{opacity:.7}
.fullbar select{width:auto;padding:6px 8px}
.fullbar .chk{margin:0}
#treebar button:disabled{opacity:.45;cursor:default}

@media (max-width:900px){
  body{display:block;height:auto;overflow:auto}
  #side{border-right:none;border-bottom:1px solid var(--line)}
  #list{max-height:200px}
  #tree{height:65vh;border-bottom:1px solid var(--line)}
  #canvas{padding:24px 16px}
  #panel{border-left:none}
}
</style>
</head>
<body>
<aside id="side">
  <header><div class="hd"><h1>Family Tree</h1><button class="x" data-act="toggleSide" title="Hide this panel">«</button></div>
    <label class="fld rootpick"><span>Main person (owner of the tree)</span><select id="rootSel"></select></label>
  </header>
  <input id="search" type="search" placeholder="Search people…">
  <ul id="list"></ul>
  <div class="side-actions">
    <button class="primary" data-act="new">+ New person</button>
    <div class="two">
      <button data-act="exportJson" title="Download a full backup you can import later">Save backup</button>
      <button data-act="import" title="Load a backup or a GEDCOM file">Open file…</button>
    </div>
    <button data-act="exportGed" title="GEDCOM works with Gramps, Ancestry, MyHeritage, FamilySearch and others">Export GEDCOM</button>
    <div class="two">
      <button data-act="relFind" title="Find out how any two people are related">How related?</button>
      <button data-act="dates" title="Upcoming birthdays and anniversaries">Birthdays</button>
    </div>
  </div>
  <div id="status"></div>
  <input id="file" type="file" accept=".json,.ged,.gedcom,text/plain" hidden>
  <input id="photoFile" type="file" accept="image/*" hidden>
</aside>

<main id="tree"><div id="treebar"><button id="sideOpen" data-act="toggleSide" title="Show the people list">☰ People</button><button class="zb" id="undoBtn" data-act="undo" title="Undo (⌘/Ctrl + Z)" disabled>↶</button><button class="zb" id="redoBtn" data-act="redo" title="Redo (⌘/Ctrl + Shift + Z)" disabled>↷</button><button data-act="center" title="Scroll back to the main person">★ Main person</button><button class="zb" data-act="zoomOut" title="Zoom out (or pinch / Ctrl + scroll)">−</button><button class="zb" data-act="zoomReset" id="zoomLbl" title="Reset to 100%">100%</button><button class="zb" data-act="zoomIn" title="Zoom in">+</button><button data-act="zoomFit" title="Fit the whole tree on screen">Fit</button><button data-act="fullTree" title="Family tree, ancestor and descendant charts you can save or print">Charts &amp; print</button></div><div id="canvas"><svg id="lines"></svg><div id="rows"></div></div></main>

<section id="panel"></section>

<dialog id="full">
  <div class="fullbar"><h3>Charts</h3>
    <select id="chartType" title="Kind of chart">
      <option value="all">Whole family</option>
      <option value="anc">Ancestors</option>
      <option value="desc">Descendants</option>
    </select>
    <span class="muted">of</span>
    <select id="chartWho" title="Whose chart"></select>
    <label class="chk" title="Shows “Living” instead of dates and leaves out photos for people who are still alive — good for sharing"><input type="checkbox" id="chartPriv"> Hide living people’s details</label>
    <button data-x="size">Actual size</button>
    <button data-x="png" class="primary">Save as image</button>
    <button data-x="svg">Save as SVG</button>
    <button data-x="print">Print / PDF</button>
    <button data-x="close">Close</button></div>
  <div id="fullView"></div>
</dialog>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h3 id="dTitle"></h3>
    <div id="dExistWrap">
      <label class="fld"><span>Someone already in your tree</span>
        <select id="dExisting"></select></label>
      <div class="or">— or add a new person —</div>
    </div>
    <div id="dNew">
      <div class="two">
        <label class="fld"><span>Given names</span><input id="dGiven" autocomplete="off"></label>
        <label class="fld"><span>Surname</span><input id="dSurname" autocomplete="off"></label>
      </div>
      <div class="two">
        <label class="fld"><span>Sex</span><select id="dSex"><option value="">Unknown</option><option value="M">Male</option><option value="F">Female</option></select></label>
        <label class="fld"><span>Born</span><input id="dBirth" placeholder="e.g. 1921, abt 1890"></label>
      </div>
    </div>
    <label class="fld" id="dOtherWrap"><span>Other parent</span><select id="dOther"></select></label>
    <label class="fld" id="dTypeWrap"><span>Relationship</span><select id="dType"></select></label>
    <menu><button value="cancel" formnovalidate>Cancel</button><button value="ok" class="primary">Add</button></menu>
  </form>
</dialog>

<dialog id="relDlg">
  <h3>How are they related?</h3>
  <div class="two">
    <label class="fld"><span>Person</span><select id="relA"></select></label>
    <label class="fld"><span>and</span><select id="relB"></select></label>
  </div>
  <div id="relOut" class="out"></div>
  <menu><button data-x="close">Close</button></menu>
</dialog>

<dialog id="datesDlg">
  <h3>Birthdays &amp; anniversaries</h3>
  <div id="datesOut"></div>
  <menu><button data-x="close">Close</button></menu>
</dialog>

<script>
const KEY = 'familytree.v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// root = the main person the tree is drawn from; focus = the person selected for editing.
let db = { people: {}, families: {}, root: null, focus: null, exportedAt: null };
try { const s = localStorage.getItem(KEY); if (s) db = Object.assign(db, JSON.parse(s)); } catch (e) {}

let saveFailed = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); saveFailed = false; }
  catch (e) { saveFailed = true; }
  renderStatus();
}

// ---------- data helpers ----------
// A family = up to two partners (a, b) plus their children. Each person is a child in at most one family.
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const P = id => id ? db.people[id] : null;
const fams = () => Object.values(db.families);
const parentFam = id => fams().find(f => f.children.includes(id));
const spouseFams = id => fams().filter(f => f.a === id || f.b === id);
const partnerOf = (f, id) => f.a === id ? f.b : f.a;
const yearOf = d => { const m = String(d || '').match(/\d{4}/); return m ? +m[0] : null; };
const fullName = p => p ? ([p.given, p.surname].filter(Boolean).join(' ') || 'Unnamed') : '';
const givenOf = p => (p && (p.given || '').split(' ')[0]) || fullName(p);
const isDead = p => !!(p.deathDate || p.deathPlace || p.burialPlace || p.deceased);
// Treated as living: no sign of death and not born more than 105 years ago.
const isLiving = p => !isDead(p) && !((yearOf(p.birthDate) ?? 9999) < new Date().getFullYear() - 105);
function span(p) {
  const b = yearOf(p.birthDate), d = yearOf(p.deathDate);
  if (b && d) return `${b} – ${d}`;
  if (b) return isDead(p) ? `${b} – ?` : `b. ${b}`;
  if (d) return `d. ${d}`;
  return isDead(p) ? 'deceased' : '';
}

// Partnerships: each family can say what kind of relationship it was, with dates.
const REL_TYPES = [['', 'Not specified'], ['married', 'Married'], ['partners', 'Partners (not married)'], ['engaged', 'Engaged'],
  ['separated', 'Separated'], ['divorced', 'Divorced'], ['affair', 'Affair / brief relationship'], ['other', 'Other']];
const relLabel = t => (REL_TYPES.find(r => r[0] === (t || '')) || REL_TYPES[0])[1];
const SYMBOLS = { married: '⚭', divorced: '✕', separated: '//', partners: '♡', engaged: '◇', affair: '♡' };
const relSymbol = t => SYMBOLS[t] || '';
const SYMBOL_KEY = { married: 'married', divorced: 'divorced', separated: 'separated', partners: 'partners', engaged: 'engaged' };
const relDashed = t => ['divorced', 'separated', 'affair'].includes(t);
function relSummary(f) {
  const bits = [relLabel(f.type)];
  if (f.start) bits.push((f.type === 'engaged' ? 'from ' : f.type === 'married' || f.type === 'divorced' || f.type === 'separated' ? 'married ' : 'from ') + f.start);
  if (f.end) bits.push((f.type === 'divorced' ? 'divorced ' : 'until ') + f.end);
  return bits.join(' · ');
}
// Order someone's partnerships oldest first (by start date, else by the eldest child's birth).
const famYear = f => yearOf(f.start) ?? Math.min(...f.children.map(c => yearOf(P(c)?.birthDate) ?? 1e9), 1e9);
const sortFams = list => [...list].sort((x, y) => famYear(x) - famYear(y));

// ---------- photos (kept in the browser's IndexedDB, separate from the tree data) ----------
const photos = {};
let idbP = null;
function idb() {
  return idbP ||= new Promise((res, rej) => {
    const r = indexedDB.open('familytree-photos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function idbTx(mode, fn) {
  return idb().then(d => new Promise((res, rej) => {
    const tx = d.transaction('photos', mode), out = fn(tx.objectStore('photos'));
    tx.oncomplete = () => res(out && out.result); tx.onerror = tx.onabort = () => rej(tx.error);
  }));
}
async function loadPhotos() {
  try {
    const keys = await idbTx('readonly', st => st.getAllKeys()), vals = await idbTx('readonly', st => st.getAll());
    keys.forEach((k, i) => photos[k] = vals[i]);
  } catch (e) {}
}
async function setPhoto(id, url) {
  if (url) photos[id] = url; else delete photos[id];
  renderTree(); renderPanel();
  try { await idbTx('readwrite', st => url ? st.put(url, id) : st.delete(id)); }
  catch (e) { alert('Could not save the photo in this browser. It will be lost when you close the page — use “Save backup”.'); }
}
async function replacePhotos(obj) {
  for (const k in photos) delete photos[k];
  Object.assign(photos, obj || {});
  try { await idbTx('readwrite', st => { st.clear(); for (const k in photos) st.put(photos[k], k); }); } catch (e) {}
}
// Shrink a picture to a small JPEG so hundreds fit in the browser.
async function shrinkImage(file, max = 360) {
  const u = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = u; });
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    g.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.85);
  } finally { URL.revokeObjectURL(u); }
}

// ---------- undo / redo ----------
let undoStack = [], redoStack = [], editKey = null;
const snap = () => JSON.stringify({ people: db.people, families: db.families, root: db.root, focus: db.focus });
function pushUndo() { undoStack.push(snap()); if (undoStack.length > 80) undoStack.shift(); redoStack = []; updUndo(); }
function restoreSnap(s) { Object.assign(db, JSON.parse(s)); normalize(); save(); renderAll(); }
function undo() { if (!undoStack.length) return; redoStack.push(snap()); editKey = null; restoreSnap(undoStack.pop()); updUndo(); }
function redo() { if (!redoStack.length) return; undoStack.push(snap()); editKey = null; restoreSnap(redoStack.pop()); updUndo(); }
function updUndo() { const u = $('#undoBtn'), r = $('#redoBtn'); if (u) { u.disabled = !undoStack.length; r.disabled = !redoStack.length; } }
// Typing in one field counts as one undo step.
function trackEdit(key) { if (key !== editKey) { pushUndo(); editKey = key; } }
const sortByBirth = ids => [...ids].sort((x, y) => (yearOf(P(x).birthDate) ?? 1e9) - (yearOf(P(y).birthDate) ?? 1e9));
const sortedPeople = () => Object.values(db.people).sort((x, y) =>
  (x.surname || '').localeCompare(y.surname || '') || (x.given || '').localeCompare(y.given || ''));
function orderedSlots(f) { // father-ish first, mother-ish second
  let [x, y] = [f.a, f.b];
  if ((P(y)?.sex === 'M' && P(x)?.sex !== 'M') || (P(x)?.sex === 'F' && P(y)?.sex !== 'F')) [x, y] = [y, x];
  return [x, y];
}
function newFam(a, b, children) { const f = { id: uid('f'), a, b, children }; db.families[f.id] = f; return f; }

const MONTHS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
// Day and month from dates like "12 Mar 1921", "March 12, 1921", "1921-03-12" or "12.03.1921" (day first).
function dayMonth(s) {

  if (m && MONTHS.includes(m[2])) return { d: +m[1], m: MONTHS.indexOf(m[2]), y: m[3] ? +m[3] : null };
  m = s.match(/([a-z]{3})[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s*(\d{4})?/);

  m = s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})$/);

function minShift(a, b, gapAt = () => GRP) {
  let dx = -Infinity;
  for (const l in b.cont) if (a.cont[l]) dx = Math.max(dx, a.cont[l][1] + gapAt(+l) - b.cont[l][0]);
  return dx;
}
// Append block b to the right of block a (a grows).
function append(a, b, gapAt) {
  if (isEmpty(a)) { absorb(a, b); return a; }
  let dx = minShift(a, b, gapAt);
  if (dx === -Infinity) {
    const ends = x => Object.values(x.cont);
    dx = Math.max(...ends(a).map(c => c[1])) + GRP - Math.min(...ends(b).map(c => c[0]));
  }
  shift(b, dx); absorb(a, b); return a;
}
const rowGap = level => l => l === level ? SIB : GRP;

// A person with their partners next to them and all their descendants below.
// An unknown other parent gets an empty "+ Add partner" box.
function descUnit(pid, level, tone, path, isRoot) {
  const b = blk(), next = new Set(path).add(pid);
  const sfs = path.has(pid) || level < -60 ? [] : sortFams(spouseFams(pid));
  const key = put(b, { id: pid, cls: isRoot ? 'line root' : tone, level, x: 0 });
  let x = W + GAP;
  const fams = [];
  for (const f of sfs) {
    const sp = partnerOf(f, pid);
    if (sp) { const k = put(b, { id: sp, cls: 'spouse ' + tone, level, x }); b.couples.push([key, k, f.id]); fams.push({ f, top: [key, k], from: [key, k] }); }
    else if (noGhosts) { fams.push({ f, top: [key], from: [key] }); continue; }
    else { const k = put(b, { ghost: true, label: '+ Add partner', act: 'fillPartner', pid, fam: f.id, level, x }); fams.push({ f, top: [key, k], from: [key] }); }
    x += W + GAP;
  }
  if (isRoot && !sfs.length && !noGhosts) { put(b, { ghost: true, label: '+ Add partner', act: 'addSpouse', pid, level, x }); fams.push({ f: null, top: [key], from: [key] }); }

  // Children of each partnership, centered under that couple, never overlapping each other.
  let below = blk();
  for (const { f, top, from } of fams) {
    const kids = blk(), kidKeys = [];
    for (const c of f ? sortByBirth(f.children) : []) {
      const u = descUnit(c, level - 1, isRoot ? 'kid' : tone, next);
      append(kids, u.b, rowGap(level - 1)); kidKeys.push(u.key);
    }
    let addKey = null;
    if (isRoot && !noGhosts) { const g = blk(); addKey = put(g, { ghost: true, label: '+ Add child', act: 'addChild', pid, fam: f ? f.id : '', level: level - 1, x: 0 }); append(kids, g, rowGap(level - 1)); }
    if (isEmpty(kids)) continue;
    const mid = top.reduce((s, k) => s + itemAt(b, k).x, 0) / top.length + W / 2;
    shift(kids, mid - center(kids, level - 1));
    if (!isEmpty(below)) { const dx = minShift(below, kids); if (dx > 0) shift(kids, dx); }
    kidKeys.forEach(k => kids.edges.push({ from, to: k }));
    if (addKey) kids.edges.push({ from, to: addKey, ghost: true });
    absorb(below, kids);
  }
  absorb(b, below);
  return { b, key };
}

function ghostUnit(role, pid, level) {
  const b = blk();
  const key = put(b, { ghost: true, label: role === 'father' ? '+ Add father' : '+ Add mother', act: 'addParent', role, pid, level, x: 0 });
  return { b, key, ghost: true };
}

// Put the parents' lines (father left, mother right) above row block M, keeping M centered
// under the couple while nothing overlaps.
function withParents(F, M, childKeys, anchorKey, level, path, ghostFor) {
  const [fa, mo] = F ? orderedSlots(F) : [null, null];
  const unit = (pid, side, role) => pid ? lineBlock(pid, side, level + 1, path, F) : ghostFor && !noGhosts ? ghostUnit(role, ghostFor, level + 1) : null;
  const L = unit(fa, 'L', 'father'), R = unit(mo, 'R', 'mother');
  if (!L && !R) return M;
  const real = [L, R].filter(u => u && !u.ghost).map(u => u.key), ghosts = [L, R].filter(u => u && u.ghost).map(u => u.key);
  if (real.length) childKeys.forEach(k => M.edges.push({ from: real, to: k }));
  if (ghosts.length) M.edges.push({ from: ghosts, to: anchorKey, ghost: true });
  const mc = center(M, level);
  if (L && R) {
    const fx = itemAt(L.b, L.key).x + W / 2, mx = itemAt(R.b, R.key).x + W / 2;
    const a = minShift(L.b, M), c = minShift(M, R.b), b0 = minShift(L.b, R.b, l => l === level + 1 ? CPL : GRP);
    let r = b0, m = 0;
    for (let i = 0; i < 40; i++) {
      m = Math.max(a, (fx + mx + r) / 2 - mc);
      const r2 = Math.max(b0, m + c, 2 * (m + mc) - fx - mx);
      if (r2 - r < 0.5) break;
      r = r2;
    }
    m = Math.max(a, (fx + mx + r) / 2 - mc); r = Math.max(r, m + c);
    shift(M, m); shift(R.b, r);
    if (real.length === 2) L.b.couples.push([L.key, R.key, F.id]);
    absorb(L.b, M); absorb(L.b, R.b);
    return L.b;
  }
  const U = L || R;
  let m = itemAt(U.b, U.key).x + W / 2 - mc;
  m = L ? Math.max(m, minShift(L.b, M)) : Math.min(m, -minShift(M, R.b));
  shift(M, m); absorb(U.b, M);
  return U.b;
}

// One ancestor plus their siblings (with the siblings' families) at `level`, all ancestors above.
// side 'L' puts the ancestor at the right end of the row (father's side), 'R' at the left end.
// An ancestor's other partnership (not the one leading to the main person): the partner with their children below.
function partnerUnit(f, pid, level) {
  const b = blk(), sp = partnerOf(f, pid);
  const spKey = sp ? put(b, { id: sp, cls: 'spouse sib', level, x: 0 }) : null;
  const kids = blk(), kidKeys = [];
  for (const c of sortByBirth(f.children)) {
    const u = descUnit(c, level - 1, 'sib', new Set([pid]));
    append(kids, u.b, rowGap(level - 1)); kidKeys.push(u.key);
  }
  if (!isEmpty(kids)) { if (spKey) shift(kids, W / 2 - center(kids, level - 1)); absorb(b, kids); }
  return { b, spKey, kidKeys, f };
}
// The ancestor's card plus any other partners on the outer side (father's to the left, mother's to the right).
function lineCard(pid, side, level, via) {
  const one = blk(), key = put(one, { id: pid, cls: 'line', level, x: 0 });
  const others = chartMode === 'anc' ? [] : sortFams(spouseFams(pid)).filter(f => f !== via);
  if (!others.length) return { b: one, key };
  const gap = l => l === level ? GAP : GRP;
  let acc = one;
  const units = others.map(f => partnerUnit(f, pid, level));
  if (side === 'L') { acc = blk(); for (const u of [...units].reverse()) append(acc, u.b, gap); append(acc, one, gap); }
  else for (const u of units) append(acc, u.b, gap);
  for (const u of units) {
    if (u.spKey) acc.couples.push([key, u.spKey, u.f.id]);
    const from = u.spKey ? [key, u.spKey] : [key];
    u.kidKeys.forEach(k => acc.edges.push({ from, to: k }));
  }
  return { b: acc, key };
}

function lineBlock(pid, side, level, path, via) {
  const stop = path.has(pid) || level > 60; // guard against loops in bad data
  const F = stop ? null : parentFam(pid);
  const sibs = F && chartMode !== 'anc' ? sortByBirth(F.children.filter(c => c !== pid)) : [];
  const ids = side === 'L' ? [...sibs, pid] : [pid, ...sibs];
  const M = blk(), keys = [];
  let key;
  for (const id of ids) {
    if (id === pid) { const one = stop ? (() => { const o = blk(); key = put(o, { id, cls: 'line', level, x: 0 }); return { b: o, key }; })() : lineCard(pid, side, level, via); key = one.key; append(M, one.b, rowGap(level)); keys.push(key); }
    else { const u = descUnit(id, level, 'sib', new Set()); append(M, u.b, rowGap(level)); keys.push(u.key); }
  }
  return { b: withParents(F, M, keys, key, level, new Set(path).add(pid), stop ? null : pid), key };
}

// The main person's generation (siblings and their families, plus the main person's own family
// below them), with all the ancestry above.
// chartMode: 'all' = whole family, 'anc' = direct ancestors only, 'desc' = descendants only.
let chartMode = 'all';
function rootBlock(root) {
  if (chartMode === 'desc') return descUnit(root, 0, 'kid', new Set(), true).b;
  const F = parentFam(root), M = blk(), keys = [];
  let rk;
  if (chartMode === 'anc') {
    rk = put(M, { id: root, cls: 'line root', level: 0, x: 0 });
    return withParents(F, M, [rk], rk, 0, new Set([root]), root);
  }
  for (const id of F ? sortByBirth(F.children) : [root]) {
    const u = id === root ? descUnit(root, 0, 'kid', new Set(), true) : descUnit(id, 0, 'sib', new Set([root]));
    if (id === root) rk = u.key;
    append(M, u.b, rowGap(0)); keys.push(u.key);
  }
  return withParents(F, M, keys, rk, 0, new Set([root]), root);
}

// Partners who aren't also blood relatives (e.g. cousins who married) get the "married in" style.
const bloodIds = b => new Set(b.items.filter(it => !it.ghost && !/spouse/.test(it.cls)).map(it => it.id));

// Connecting lines for a laid-out tree: d = solid lines, dg = dashed lines to empty boxes.
function buildLines(b, pos) {
  const box = k => { const p = pos[k]; return { l: p.x, r: p.x + W, cx: p.x + W / 2, t: p.y, b: p.y + H, cy: p.y + H / 2 }; };
  let d = '', dg = '', de = '';
  const marks = []; // relationship symbols (⚭ married, ⚮ divorced/separated, ⚯ other) on couple lines
  // If other cards sit between two partners (e.g. cousins), the couple line goes under the cards.
  const byLevel = {};
  for (const it of b.items) (byLevel[it.level] ||= []).push(pos[it.key].x);
  const coupleKey = (a, c) => [a, c].sort().join('|'), under = new Set();
  for (const [a, c, fid] of b.couples) {
    const [x, y] = [box(a), box(c)].sort((m, n) => m.l - n.l), f = db.families[fid];
    let seg, mx, my;
    if (byLevel[itemAt(b, a).level].some(px => px > x.l + 1 && px < y.l - 1)) {
      under.add(coupleKey(a, c));
      seg = `M${x.r - 24} ${x.b}V${x.b + 12}H${y.l + 24}V${y.b}`; mx = (x.r + y.l) / 2; my = x.b + 12;
    } else { seg = `M${x.r} ${x.cy}H${y.l}`; mx = (x.r + y.l) / 2; my = x.cy; }
    if (f && relDashed(f.type)) de += seg; else d += seg;
    if (f && relSymbol(f.type)) marks.push({ x: mx, y: my, f });
  }
  for (const e of b.edges) {
    const ps = e.from.map(box), c = box(e.to);
    const low = ps.length === 2 && under.has(coupleKey(...e.from));
    const [sx, sy] = ps.length === 2 ? [(ps[0].cx + ps[1].cx) / 2, low ? ps[0].b + 12 : ps[0].cy] : [ps[0].cx, ps[0].b];
    const seg = `M${sx} ${sy}V${c.t - VGAP / 2}H${c.cx}V${c.t}`;
    if (e.ghost) dg += seg; else d += seg;
  }
  return { d, dg, de, marks };
}

// Small "+ add" buttons around the located person for links that are missing.
function addonsHtml(it, pos) {

  const used = [...new Set(marks.map(m => m.f.type))].filter(t => SYMBOL_KEY[t]);
  const legend = used.length ? ' · ' + used.map(t => `${SYMBOLS[t]} ${SYMBOL_KEY[t]}`).join('   ') + (marks.some(m => relDashed(m.f.type)) ? '   - - ended' : '') : '';
  const people = new Set(b.items.map(i => i.id)).size, gens = top - bot + 1;
  const title = { all: 'Family tree of ', anc: 'Ancestors of ', desc: 'Descendants of ' }[type] + fullName(P(who));
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`
    + `<rect width="100%" height="100%" fill="#fffdf8"/>`
    + `<text x="${M}" y="${M + 18}" font-family="Georgia,'Times New Roman',serif" font-size="26" font-weight="600" fill="#2b2622">${esc(title)}</text>`
    + `<text x="${M}" y="${M + 42}" font-family='${FONT}' font-size="13" fill="#7a6f64">${people} ${people === 1 ? 'person' : 'people'} · ${gens} generation${gens === 1 ? '' : 's'} · ${new Date().toLocaleDateString()}${esc(legend)}</text>`
    + `<path d="${d}" fill="none" stroke="#4a3b2e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>`
    + `<path d="${de}" fill="none" stroke="#4a3b2e" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round"/>`
    + cards + sym + `</svg>`;
  return { svg, width, height, title };
}

function savePng() {
  const { svg, width, height } = fullPic;
  const scale = Math.min(2, 16000 / width, 16000 / height, Math.sqrt(120e6 / (width * height))); // stay within browser canvas limits
  const img = new Image(), url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = Math.round(width * scale); c.height = Math.round(height * scale);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    c.toBlob(bl => bl ? download(picName('png'), bl, 'image/png') : alert('The tree is too large to save as an image — try “Save as SVG”.'), 'image/png');
  };
  img.onerror = () => { URL.revokeObjectURL(url); alert('Could not create the image — try “Save as SVG”.'); };
  img.src = url;
}

// ---------- zoom ----------
// Zoom keeps the point under the cursor (or the middle of the view) in place.
function setZoom(z, at) {
  const main = $('#tree'), r = main.getBoundingClientRect();
  const mx = at ? at.clientX - r.left : main.clientWidth / 2, my = at ? at.clientY - r.top : main.clientHeight / 2;
  const px = (main.scrollLeft + mx) / zoom - orgX, py = (main.scrollTop + my) / zoom - orgY; // point on the tree itself
  zoom = Math.min(2, Math.max(0.1, z));
  try { localStorage.setItem(ZKEY, zoom); } catch (e) {}
  renderTree();
  main.scrollLeft = (px + orgX) * zoom - mx; main.scrollTop = (py + orgY) * zoom - my;
}
function zoomFit() {
  const main = $('#tree');
  if (!treeW) return;
  setZoom(Math.min(1, main.clientWidth / treeW, (main.clientHeight - $('#treebar').offsetHeight) / treeH));
  main.scrollLeft = (orgX - PAD) * zoom - (main.clientWidth - treeW * zoom) / 2;
  main.scrollTop = (orgY - PAD) * zoom - $('#treebar').offsetHeight;
}
$('#tree').addEventListener('wheel', e => {
  if (!e.ctrlKey && !e.metaKey) return; // trackpad pinch arrives as ctrl + wheel
  e.preventDefault();
  setZoom(zoom * Math.exp(-e.deltaY * 0.01), e);
}, { passive: false });

function renderPanel() {
  const p = P(db.focus), el = $('#panel');
  if (!p) { el.innerHTML = '<p class="muted">Select or add a person to see their details here.</p>'; return; }
  const pf = parentFam(p.id), sfs = spouseFams(p.id);
  const rel = (id, unlinkSpec, note) => `<div class="rel"><a data-id="${id}">${esc(fullName(P(id)))}${note ? ` <span class="yr">· ${esc(note)}</span>` : ''}</a><span class="yr">${esc(span(P(id)))}</span>${unlinkSpec ? `<button class="x" title="Remove this link (does not delete the person)" data-unlink="${unlinkSpec}">✕</button>` : ''}</div>`;
  const none = '<div class="none">None listed</div>';
  const fld = (f, label, ph = '') => `<label class="fld"><span>${label}</span><input data-f="${f}" value="${esc(p[f])}" placeholder="${esc(ph)}"></label>`;

  const parents = pf ? orderedSlots(pf).filter(Boolean).map(x => rel(x, `parent:${pf.id}:${x}`)).join('') : '';
  // Full siblings share both parents; half-siblings come from a parent's other partnerships.
  const halfIds = pf ? [pf.a, pf.b].filter(Boolean).flatMap(x => spouseFams(x).filter(f => f !== pf).flatMap(f => f.children)) : [];
  const sibs = pf ? [...sortByBirth(pf.children.filter(c => c !== p.id)).map(x => rel(x)),
    ...sortByBirth([...new Set(halfIds)].filter(c => c !== p.id)).map(x => rel(x, null, 'half'))].join('') : '';
  // Each partnership: who, what kind of relationship, and when.
  const spouses = sortFams(sfs).map(f => {
    const sp = partnerOf(f, p.id), nk = f.children.length;
    const head = sp ? rel(sp, `spouse:${f.id}`)
      : `<div class="rel"><span class="none" style="flex:1">Unknown partner · ${nk} child${nk === 1 ? '' : 'ren'}</span><button class="x" data-act="fillPartner" data-fam="${f.id}" data-pid="${p.id}" title="Add the other parent">+ add</button></div>`;
    const t = f.type || '';
    const ph1 = t === 'engaged' ? 'Engaged on' : ['married', 'divorced', 'separated', ''].includes(t) ? 'Married on' : 'From';
    const ph2 = t === 'divorced' ? 'Divorced on' : t === 'separated' ? 'Separated on' : 'Until';
    return `<div class="pship">${head}<div class="three">
      <select data-fam="${f.id}" data-ff="type" title="Kind of relationship">${REL_TYPES.map(([v, l]) => `<option value="${v}" ${t === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <input data-fam="${f.id}" data-ff="start" value="${esc(f.start || '')}" placeholder="${ph1}" title="${ph1}">
      <input data-fam="${f.id}" data-ff="end" value="${esc(f.end || '')}" placeholder="${ph2}" title="${ph2}"></div></div>`;
  }).join('');
  const kids = sfs.flatMap(f => f.children.map(c => [f, c])).sort((x, y) => (yearOf(P(x[1]).birthDate) ?? 1e9) - (yearOf(P(y[1]).birthDate) ?? 1e9))
    .map(([f, c]) => {
      const other = partnerOf(f, p.id);
      return rel(c, `child:${f.id}:${c}`, sfs.length > 1 ? (other ? 'with ' + givenOf(P(other)) : 'other parent unknown') : '');
    }).join('');

  const rootCtl = p.id === db.root
    ? '<div class="rootnote">★ Main person — the tree is drawn from them</div>'
    : '<button class="mk" data-act="makeRoot">★ Make main person</button>';
  const hint = shownIds.has(p.id) ? '' : `<p class="hint">Not shown in ${esc(fullName(P(db.root)))}’s tree. The tree shows their ancestors with their siblings, plus their partners and children.</p>`;
  const ph = photos[p.id];
  const photo = `<div class="photo">${ph ? `<img src="${ph}" alt="Photo of ${esc(fullName(p))}">` : `<div class="ph0">${esc((p.given || p.surname || '?').trim()[0] || '?')}</div>`}
    <div class="btns"><button data-act="photo">${ph ? 'Change photo' : 'Add photo'}</button>${ph ? '<button class="x" data-act="rmPhoto">Remove photo</button>' : ''}</div></div>`;
  let relto = '';
  if (p.id !== db.root && P(db.root)) {
    const r = relInfo(db.root, p.id), rn = `<a data-id="${db.root}">${esc(fullName(P(db.root)))}</a>`;
    relto = `<div class="relto">${r ? `${rn}’s ${esc(r.text)}` : `No known relation to ${rn}`}</div>`;
  }
  const dead = isDead(p);
  el.innerHTML = `<h2 id="pName">${esc(fullName(p))}</h2>${relto}${rootCtl}${hint}${photo}
    <div class="two">${fld('given', 'Given names')}${fld('surname', 'Surname (at birth)')}</div>
    <div class="two">${fld('nickname', 'Also known as', 'nickname, married name')}<label class="fld"><span>Sex</span><select data-f="sex">${[['', 'Unknown'], ['M', 'Male'], ['F', 'Female']].map(([v, l]) => `<option value="${v}" ${p.sex === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label></div>
    <div class="two">${fld('birthDate', 'Born', 'e.g. 12 Mar 1921')}${fld('birthPlace', 'Birthplace')}</div>
    <label class="chk" title="Tick if they have passed away but the date is unknown"><input type="checkbox" data-f="deceased" ${dead ? 'checked' : ''} ${dead && !p.deceased ? 'disabled' : ''}> Deceased</label>
    ${dead ? `<div class="two">${fld('deathDate', 'Died', 'e.g. 3 Jun 1990')}${fld('deathPlace', 'Place of death')}</div>${fld('burialPlace', 'Buried in')}` : ''}
    <div class="two">${fld('occupation', 'Occupation')}${fld('residence', 'Lived in')}</div>
    <label class="fld"><span>Notes &amp; stories</span><textarea data-f="notes" rows="5" placeholder="Memories, stories, life events…">${esc(p.notes)}</textarea></label>
    <label class="fld"><span>Sources</span><textarea data-f="sources" rows="2" placeholder="Where this came from: a birth certificate, Grandma’s letter, a census record…">${esc(p.sources || '')}</textarea></label>
    <h3>Parents</h3>${parents || none}
    <h3>Partners</h3>${spouses || none}
    <h3>Children</h3>${kids || none}
    <h3>Siblings</h3>${sibs || none}
    <div class="adds">
      <button data-act="addParent" data-role="parent">+ Parent</button>
      <button data-act="addSpouse">${spouses ? '+ Another partner' : '+ Partner'}</button>
      <button data-act="addChild">+ Child</button>
      <button data-act="addSibling">+ Sibling</button>
    </div>
    <button class="danger" data-act="delete">Delete ${esc(fullName(p))}…</button>`;
}

// ---------- files ----------
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const today = () => new Date().toISOString().slice(0, 10);
function exportJson() {
  if (!Object.keys(db.people).length) return alert('Your tree is empty.');
  db.exportedAt = Date.now(); save();
  const pics = Object.fromEntries(Object.entries(photos).filter(([id]) => P(id)));
  download(`family-tree-${today()}.json`, JSON.stringify({ app: 'family-tree', version: 2, people: db.people, families: db.families, root: db.root, focus: db.focus, photos: pics }, null, 2), 'application/json');
}

function exportGedcom() {
  if (!Object.keys(db.people).length) return alert('Your tree is empty.');
  const priv = Object.values(db.people).some(isLiving) && confirm('Leave out the details of living people (birth dates, places, notes)?\n\nOK — yes, for sharing with others\nCancel — no, export everything (for your own use)');
  const iid = {}, fid = {};
  Object.keys(db.people).forEach((id, i) => iid[id] = `@I${i + 1}@`);
  Object.keys(db.families).forEach((id, i) => fid[id] = `@F${i + 1}@`);
  const t = s => String(s).replace(/@/g, '@@');
  const out = ['0 HEAD', '1 SOUR FamilyTreeHTML', '1 GEDC', '2 VERS 5.5.1', '2 FORM LINEAGE-LINKED', '1 CHAR UTF-8'];
  const note = (lvl, text) => text.split(/\r?\n/).forEach((ln, i) => out.push(i ? `${lvl + 1} CONT ${t(ln)}` : `${lvl} NOTE ${t(ln)}`));
  for (const p of Object.values(db.people)) {
    out.push(`0 ${iid[p.id]} INDI`, `1 NAME ${t(p.given || '')} /${t(p.surname || '')}/`);
    if (p.given) out.push(`2 GIVN ${t(p.given)}`);
    if (p.surname) out.push(`2 SURN ${t(p.surname)}`);
    if (p.nickname) out.push(`2 NICK ${t(p.nickname)}`);
    if (p.sex) out.push(`1 SEX ${p.sex}`);
    const hide = priv && isLiving(p);
    for (const [tag, pre] of [['BIRT', 'birth'], ['DEAT', 'death']]) {
      if (hide) break;
      if (p[pre + 'Date'] || p[pre + 'Place']) {
        out.push(`1 ${tag}`);
        if (p[pre + 'Date']) out.push(`2 DATE ${t(p[pre + 'Date'])}`);
        if (p[pre + 'Place']) out.push(`2 PLAC ${t(p[pre + 'Place'])}`);
      } else if (tag === 'DEAT' && p.deceased) out.push('1 DEAT Y');
    }
    if (p.burialPlace) out.push('1 BURI', `2 PLAC ${t(p.burialPlace)}`);
    if (!hide && p.occupation) out.push(`1 OCCU ${t(p.occupation)}`);
    if (!hide && p.residence) out.push('1 RESI', `2 PLAC ${t(p.residence)}`);
    if (!hide && p.notes) note(1, p.notes);
    if (!hide && p.sources) p.sources.split(/\r?\n/).forEach((ln, i) => out.push(i ? `2 CONT ${t(ln)}` : `1 SOUR ${t(ln)}`));
    const pf = parentFam(p.id);
    if (pf) out.push(`1 FAMC ${fid[pf.id]}`);
    spouseFams(p.id).forEach(f => out.push(`1 FAMS ${fid[f.id]}`));
  }
  for (const f of Object.values(db.families)) {
    out.push(`0 ${fid[f.id]} FAM`);
    let [h, w] = orderedSlots(f);
    if (h && P(h).sex === 'F' && !w) [h, w] = [null, h];
    if (h) out.push(`1 HUSB ${iid[h]}`);
    if (w) out.push(`1 WIFE ${iid[w]}`);
    f.children.forEach(c => out.push(`1 CHIL ${iid[c]}`));
    const ty = f.type || '';
    if (['married', 'divorced', 'separated'].includes(ty) || (!ty && f.start)) { out.push('1 MARR'); if (f.start) out.push(`2 DATE ${t(f.start)}`); }
    if (ty === 'engaged') { out.push('1 ENGA'); if (f.start) out.push(`2 DATE ${t(f.start)}`); }
    if (ty === 'divorced') { out.push('1 DIV'); if (f.end) out.push(`2 DATE ${t(f.end)}`); }
    if (ty && ty !== 'married' && ty !== 'divorced' && ty !== 'engaged') { out.push(`1 _TYPE ${ty}`); if (f.start && ty !== 'separated') out.push(`1 _START ${t(f.start)}`); }
    if (f.end && ty !== 'divorced') out.push(`1 _END ${t(f.end)}`);
  }
  out.push('0 TRLR');
  download(`family-tree-${today()}.ged`, out.join('\n') + '\n', 'text/plain');
}

function parseGedcom(text) {
  const indi = {}, fam = {};
  let rec = null, l1 = null;
  const un = s => s.replace(/@@/g, '@');
  for (const raw of text.replace(/^﻿/, '').split(/\r\n|\r|\n/)) {
    const m = raw.trim().match(/^(\d+)\s+(?:(@[^@]+@)\s+)?(\S+)(?:\s(.*))?$/);
    if (!m) continue;
    const lv = +m[1], xref = m[2], tag = m[3].toUpperCase(), val = m[4] || '';
    if (lv === 0) {
      l1 = null;
      if (tag === 'INDI') { rec = { t: 'I', p: { given: '', surname: '', sex: '', birthDate: '', birthPlace: '', deathDate: '', deathPlace: '', notes: '', nickname: '', occupation: '', residence: '', burialPlace: '', sources: '', deceased: false } }; indi[xref] = rec.p; }
      else if (tag === 'FAM') { rec = { t: 'F', f: { h: null, w: null, c: [], type: '', start: '', end: '' } }; fam[xref] = rec.f; }
      else rec = null;
      continue;
    }
    if (!rec) continue;
    if (lv === 1) {
      l1 = tag;
      if (rec.t === 'I') {
        const p = rec.p;
        if (tag === 'NAME' && !p._named) {
          p._named = true;
          const nm = val.match(/^([^/]*)\/?([^/]*)\/?(.*)$/);
          p.given = un((nm[1] + ' ' + nm[3]).trim().replace(/\s+/g, ' '));
          p.surname = un(nm[2].trim());
        } else if (tag === 'SEX') { const s = val.trim().toUpperCase()[0]; p.sex = s === 'M' || s === 'F' ? s : ''; }
        else if (tag === 'NOTE' && !val.startsWith('@')) p.notes += (p.notes ? '\n' : '') + un(val);
        else if (tag === 'OCCU' && !p.occupation) p.occupation = un(val);
        else if (tag === 'SOUR' && !val.startsWith('@') && val) p.sources += (p.sources ? '\n' : '') + un(val);
        else if (tag === 'DEAT' || tag === 'BURI') p.deceased = true;
        else if (tag === 'RESI' && val && !p.residence) p.residence = un(val);
      } else {
        const f = rec.f, v = val.trim();
        if (tag === 'HUSB') f.h = v; else if (tag === 'WIFE') f.w = v; else if (tag === 'CHIL') f.c.push(v);
        else if (tag === 'MARR') f.type ||= 'married';
        else if (tag === 'ENGA') f.type ||= 'engaged';
        else if (tag === 'DIV') f.type = 'divorced';
        else if (tag === '_TYPE' && REL_TYPES.some(r => r[0] === v)) f._t = v;
        else if (tag === '_START') f.start = un(v);
        else if (tag === '_END') f.end = un(v);
      }
    } else if (lv === 2 && rec.t === 'F') {
      const f = rec.f;
      if (tag === 'DATE' && (l1 === 'MARR' || l1 === 'ENGA') && !f.start) f.start = un(val);
      if (tag === 'DATE' && l1 === 'DIV' && !f.end) f.end = un(val);
    } else if (lv === 2 && rec.t === 'I') {
      const p = rec.p;
      if (l1 === 'NAME') { if (tag === 'GIVN' && !p.given) p.given = un(val); if (tag === 'SURN' && !p.surname) p.surname = un(val); if (tag === 'NICK' && !p.nickname) p.nickname = un(val); }
      else if ((l1 === 'RESI' || l1 === 'BURI') && tag === 'PLAC') { const k = l1 === 'RESI' ? 'residence' : 'burialPlace'; if (!p[k]) p[k] = un(val); }
      else if (l1 === 'SOUR' && (tag === 'CONT' || tag === 'CONC')) p.sources += (tag === 'CONT' ? '\n' : '') + un(val);
      else if (l1 === 'BIRT' || l1 === 'DEAT') {
        const pre = l1 === 'BIRT' ? 'birth' : 'death';
        if (tag === 'DATE' && !p[pre + 'Date']) p[pre + 'Date'] = un(val);
        if (tag === 'PLAC' && !p[pre + 'Place']) p[pre + 'Place'] = un(val);
      } else if (l1 === 'NOTE') { if (tag === 'CONT') p.notes += '\n' + un(val); if (tag === 'CONC') p.notes += un(val); }
    }
  }
  const people = {}, families = {}, map = {};
  for (const [x, p] of Object.entries(indi)) { delete p._named; p.id = uid('p'); map[x] = p.id; people[p.id] = p; }
  for (const f of Object.values(fam)) {
    const id = uid('f');
    families[id] = { id, a: map[f.h] || null, b: map[f.w] || null, children: f.c.map(c => map[c]).filter(Boolean), type: f._t || f.type, start: f.start, end: f.end };
  }
  return { people, families };
}

$('#file').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  const text = await file.text();
  let data;
  try {
    if (text.trim().startsWith('{')) { data = JSON.parse(text); if (!data.people || !data.families) throw new Error('this is not a family tree backup'); }
    else data = parseGedcom(text);
  } catch (err) { return alert('Could not read that file: ' + err.message); }
  const n = Object.keys(data.people).length, cur = Object.keys(db.people).length;
  if (!n) return alert('No people were found in that file.');
  if (cur && !confirm(`Replace your current tree (${cur} people) with the ${n} people in “${file.name}”?\n\nTip: click Cancel and “Save backup” first if you're not sure.`)) return;
  pushUndo();
  db.people = data.people; db.families = data.families;
  db.root = P(data.root) ? data.root : P(data.focus) ? data.focus : null;
  db.focus = db.root;
  normalize(); scrollTo = db.root; save();
  await replacePhotos(data.photos || {});
  renderAll();
});

normalize(); renderStatus(); scrollTo = db.root; renderAll(); updUndo();
loadPhotos().then(() => { if (Object.keys(photos).length) { renderTree(); renderPanel(); } });
</script>
